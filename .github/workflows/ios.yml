name: iOS starter workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
      - name: Build
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
        run: |
          device_udid=$(xcrun simctl list devices available -j | ruby -rjson -e 'data=JSON.parse(STDIN.read); devices=data.fetch("devices", {}).select { |runtime, _| runtime.start_with?("com.apple.CoreSimulator.SimRuntime.iOS-") }.values.flatten; device=devices.find { |d| d["isAvailable"] && d["name"].to_s.start_with?("iPhone") }; puts(device ? device["udid"] : "")')
          if [ -z "$device_udid" ]; then
            echo "No available iPhone simulator found via xcrun simctl."
            echo "Available simulators:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator UDID: $device_udid"
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild build-for-testing -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "id=$device_udid"
      - name: Test
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
        run: |
          device_udid=$(xcrun simctl list devices available -j | ruby -rjson -e 'data=JSON.parse(STDIN.read); devices=data.fetch("devices", {}).select { |runtime, _| runtime.start_with?("com.apple.CoreSimulator.SimRuntime.iOS-") }.values.flatten; device=devices.find { |d| d["isAvailable"] && d["name"].to_s.start_with?("iPhone") }; puts(device ? device["udid"] : "")')
          if [ -z "$device_udid" ]; then
            echo "No available iPhone simulator found via xcrun simctl."
            echo "Available simulators:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator UDID: $device_udid"
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild test-without-building -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "id=$device_udid"
